<!-- sidebar.component.html -->
<aside class="menu-sidebar">
  <ul class="menu-list">
    <li>
      <a routerLink="/admin" routerLinkActive="is-active" [routerLinkActiveOptions]="{exact: true}">
        <span class="icon"><i class="fas fa-home"></i></span>
        <span class="menu-label">Dashboard</span>
      </a>
    </li>
    <li>
      <a routerLink="/admin/compra" routerLinkActive="is-active">
        <span class="icon"><i class="fas fa-truck-loading"></i></span>
        <span class="menu-label">Compras</span>
      </a>
    </li>
    <li>
      <a routerLink="/admin/venda" routerLinkActive="is-active" (click)="clearBadge()" class="d-flex justify-content-between align-items-center pe-3">
        <div>
          <span class="icon"><i class="fas fa-dollar-sign"></i></span>
          <span class="menu-label">Vendas</span>
        </div>
        <span *ngIf="hasNewSales" class="badge bg-danger rounded-circle p-1" style="width: 10px; height: 10px; display: inline-block;" title="Nova Venda!"></span>
      </a>
    </li>
    <li>
      <a routerLink="/admin/inventario" routerLinkActive="is-active">
        <span class="icon"><i class="fas fa-boxes"></i></span>
        <span class="menu-label">Inventário</span>
      </a>
    </li>
    <li>
      <a routerLink="/admin/relatorio" routerLinkActive="is-active">
        <span class="icon"><i class="fas fa-chart-line"></i></span>
        <span class="menu-label">Relatórios</span>
      </a>
    </li>
    <li class="mt-auto">
      <a routerLink="/dashboard" class="store-link">
        <span class="icon"><i class="fas fa-store"></i></span>
        <span class="menu-label">Loja</span>
      </a>
    </li>
  </ul>
</aside>
