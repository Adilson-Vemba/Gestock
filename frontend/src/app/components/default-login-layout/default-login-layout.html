<main>
  <section class="main-section">
    <h1>{{ title }}</h1>
    <img src="/images/main-ilustration.svg" alt="Illustration"/>
  </section>

  <section class="form-section">
    <img src="/images/Logo.svg" alt="Gestock Logo"/>
    
    <div class="form-container" style="width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center;">
      <ng-content></ng-content>

      <button class="btn-primary" (click)="submit()">{{ primarybtnText }}</button>

      <div class="divider">
        <div></div>
        <span>ou</span>
        <div></div>
      </div>

      <button class="btn-secondary" (click)="secondaryClick()">
        {{ secondarybtnText }}
      </button>
    </div>
  </section>
</main>
